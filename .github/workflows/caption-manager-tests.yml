name: Caption Manager Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  test-caption-manager:

    runs-on: ubuntu-latest

    steps:

      # ===================================================
      # CHECKOUT
      # ===================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ===================================================
      # PYTHON
      # ===================================================

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ===================================================
      # DEPENDENCIES
      # ===================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install pytest

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi


      # ===================================================
      # TESTS
      # ===================================================

      - name: Run caption manager and media handler tests

        env:
          PYTHONPATH: ${{ github.workspace }}

        run: |

          pytest -v \
            tests/test_caption_manager.py \
            tests/test_media_handler_integration.py
