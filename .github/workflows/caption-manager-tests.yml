name: Python Tests

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run full project test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -v \
            tests/test_caption_manager.py \
            tests/test_media_handler_integration.py \
            tests/test_content_entities.py \
            tests/test_webhook_handler_integration.py \
            tests/test_live_regressions.py \
            tests/test_telegram_caption_entities.py \
            tests/test_media_caption_entities_send.py \
            tests/test_branding_direction_debug.py
