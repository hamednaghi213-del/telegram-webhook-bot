name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Use Copilot reasoning effort compatible with available models
        run: echo "COPILOT_AGENT_REASONING_EFFORT=low" >> "$GITHUB_ENV"
